{{ define "content" }}
<div class="card">
    <h2 class="page-title">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7"></path><path d="M21 4v5h-5"></path></svg>
        Générateur de mots de passe
    </h2>
    <p class="page-subtitle">Généré dans votre navigateur avec <span class="mono">crypto.getRandomValues</span> — rien n'est envoyé au serveur.</p>

    <noscript>
        <div class="alert alert-error">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><path d="M12 8v5M12 16h.01"></path></svg>
            <span>Le générateur nécessite JavaScript. Laissez le champ mot de passe vide lors de l'ajout : le serveur en générera un avec <span class="mono">crypto/rand</span>.</span>
        </div>
    </noscript>

    <div class="gen-output">
        <output class="gen-password mono" data-gen-output aria-live="polite" aria-label="Mot de passe généré"></output>
        <div class="gen-output-actions">
            <button type="button" class="icon-btn" data-gen-regenerate aria-label="Générer un nouveau mot de passe">
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7"></path><path d="M21 4v5h-5"></path></svg>
            </button>
            <button type="button" class="icon-btn" data-gen-copy aria-label="Copier le mot de passe">
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2"></rect><path d="M5 15V5a2 2 0 0 1 2-2h10"></path></svg>
            </button>
        </div>
    </div>

    <div class="alert alert-error" data-gen-warning hidden>
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><path d="M12 8v5M12 16h.01"></path></svg>
        <span>Sélectionnez au moins un type de caractère.</span>
    </div>

    <div class="strength is-visible" data-gen-strength aria-live="polite">
        <div class="strength-track">
            <span class="strength-seg"></span>
            <span class="strength-seg"></span>
            <span class="strength-seg"></span>
            <span class="strength-seg"></span>
        </div>
        <div class="strength-label"></div>
    </div>

    <div class="gen-controls">
        <div class="gen-length">
            <label for="gen-length">
                Longueur
                <span class="gen-length-value mono" data-gen-length-value>20</span>
            </label>
            <input type="range" id="gen-length" min="8" max="64" value="20" step="1" data-gen-length>
        </div>

        <fieldset class="gen-classes">
            <legend>Types de caractères</legend>
            <label class="gen-check">
                <input type="checkbox" data-gen-class="lower" checked>
                <span>Minuscules <span class="mono gen-sample">a-z</span></span>
            </label>
            <label class="gen-check">
                <input type="checkbox" data-gen-class="upper" checked>
                <span>Majuscules <span class="mono gen-sample">A-Z</span></span>
            </label>
            <label class="gen-check">
                <input type="checkbox" data-gen-class="digits" checked>
                <span>Chiffres <span class="mono gen-sample is-digit">0-9</span></span>
            </label>
            <label class="gen-check">
                <input type="checkbox" data-gen-class="symbols" checked>
                <span>Symboles <span class="mono gen-sample is-symbol">!@#$</span></span>
            </label>
        </fieldset>
    </div>

    <button type="button" class="btn btn-primary btn-block" data-gen-use>
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
        Utiliser pour une nouvelle entrée
    </button>
</div>
{{ end }}
