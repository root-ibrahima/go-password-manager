{{ define "content" }}
<div class="card">
    <h2 class="page-title">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
        Ajouter une entrée
    </h2>
    <p class="page-subtitle">Le mot de passe est chiffré en AES-GCM avant d'être écrit sur le disque.</p>

    {{ if .Error }}
    <div class="alert alert-error" role="alert">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><path d="M12 8v5M12 16h.01"></path></svg>
        <span>{{ .Error }}</span>
    </div>
    {{ end }}

    <form method="POST" action="/add-password">
        <input type="hidden" name="csrf_token" value="{{ .CSRFToken }}">

        <div class="field">
            <label for="site">
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M3 12h18M12 3a15 15 0 0 1 0 18 15 15 0 0 1 0-18"></path></svg>
                Site web
            </label>
            <div class="input-wrap">
                <input type="text" id="site" name="site" placeholder="example.com" autocomplete="off" spellcheck="false" required>
            </div>
        </div>

        <div class="field">
            <label for="username">
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c0-4 4-6.5 8-6.5s8 2.5 8 6.5"></path></svg>
                Nom d'utilisateur
            </label>
            <div class="input-wrap">
                <input type="text" id="username" name="username" placeholder="alice@example.com" autocomplete="username" spellcheck="false" required>
            </div>
        </div>

        <div class="field">
            <label for="password">
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 11V7a4 4 0 0 1 8 0v4"></path><rect x="4" y="11" width="16" height="10" rx="2.5"></rect></svg>
                Mot de passe
            </label>
            <div class="input-wrap">
                <input type="password" id="password" name="password" class="mono"
                       placeholder="•••••••••••••••" autocomplete="new-password" data-strength-for>

                <button type="button" class="icon-btn" data-reveal hidden aria-pressed="false" aria-label="Afficher le mot de passe">
                    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                </button>

                <button type="button" class="icon-btn" data-generate hidden aria-label="Générer un mot de passe fort">
                    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7"></path><path d="M21 4v5h-5"></path></svg>
                </button>
            </div>

            <div class="strength" data-strength aria-live="polite">
                <div class="strength-track">
                    <span class="strength-seg"></span>
                    <span class="strength-seg"></span>
                    <span class="strength-seg"></span>
                    <span class="strength-seg"></span>
                </div>
                <div class="strength-label"></div>
            </div>

            <p class="field-hint">
                Laissez le champ vide et le serveur générera un mot de passe de 16 caractères
                avec <span class="mono">crypto/rand</span>.
            </p>
        </div>

        <button type="submit" class="btn btn-primary btn-block">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 11V7a4 4 0 0 1 8 0v4"></path><rect x="4" y="11" width="16" height="10" rx="2.5"></rect></svg>
            Chiffrer et enregistrer
        </button>
    </form>
</div>
{{ end }}
