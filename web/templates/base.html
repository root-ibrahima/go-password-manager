<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark light">
    <meta name="description" content="Gestionnaire de mots de passe chiffré — AES-GCM, SQLCipher, session verrouillée.">
    <title>SecurePass — Gestionnaire de mots de passe</title>

    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
    <link rel="preload" href="/static/fonts/inter-var-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="/static/app.css">

    <!-- Synchrone et volontairement minuscule : applique le thème avant le premier rendu. -->
    <script src="/static/theme.js"></script>
</head>
<body>
    <div class="grid-overlay" aria-hidden="true"></div>
    <a class="sr-only" href="#main">Aller au contenu principal</a>

    <nav class="navbar">
        <a href="/" class="brand">
            <span class="brand-mark">
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M8 11V7a4 4 0 0 1 8 0v4"></path>
                    <rect x="4" y="11" width="16" height="10" rx="2.5"></rect>
                    <circle cx="12" cy="16" r="1.5"></circle>
                </svg>
            </span>
            <span class="brand-text">SecurePass</span>
        </a>

        <div class="nav-links">
            <a href="/">
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-8 9 8"></path><path d="M5 10v10h14V10"></path></svg>
                Accueil
            </a>
            <a href="/passwords">
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="7" width="18" height="13" rx="2.5"></rect><path d="M8 7V5a4 4 0 0 1 8 0v2"></path></svg>
                Coffre
            </a>
            <a href="/add-password">
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
                Ajouter
            </a>
            <a href="/generator">
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7"></path><path d="M21 4v5h-5"></path></svg>
                Générateur
            </a>
            <a href="/logout">
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><path d="M16 17l5-5-5-5"></path><path d="M21 12H9"></path></svg>
                Déconnexion
            </a>

            <button type="button" class="theme-toggle" data-theme-toggle aria-label="Changer de thème">
                <svg class="icon icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"></path></svg>
                <svg class="icon icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg>
            </button>
        </div>
    </nav>

    <main class="page" id="main">
        {{ block "content" . }}{{ end }}
    </main>

    <script src="/static/app.js" defer></script>
</body>
</html>
